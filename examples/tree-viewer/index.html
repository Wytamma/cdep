<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tree Viewer · CDEP demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #0f172a;
        --muted: #64748b;
        --bg: #f8fafc;
        --panel: #ffffff;
        --border: #e2e8f0;
        --accent: #0f172a;
        --error: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --bg: #0b1120;
          --panel: #111827;
          --border: #1f2937;
          --accent: #e2e8f0;
          --error: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 20px 64px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 860px; margin: 0 auto; }
      header { margin-bottom: 24px; }
      h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.01em; }
      h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
      .sub { margin: 0; color: var(--muted); }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
      label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
      input, select, button {
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 10px;
      }
      input { min-width: 260px; }
      .upload { margin: 0 0 12px; max-width: 360px; }
      .upload input[type="file"] { min-width: 0; width: 100%; background: transparent; border: 0; padding: 0; }
      #tree:empty { display: none; }
      #bundle { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
      #bundle:empty { display: none; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
      th { color: var(--muted); font-weight: 600; }
      button { cursor: pointer; background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
      button:disabled { opacity: 0.5; cursor: progress; }
      #status { margin: 12px 0 0; min-height: 1.5em; font-size: 14px; }
      #status[data-kind="error"] { color: var(--error); }
      #session { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
      #tree { width: 100%; height: auto; color: var(--fg); }
      .meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin: 0 0 12px; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Tree Viewer</h1>
        <p class="sub">
          Imports Newick trees and exports the tree currently on screen. No backend, no shared code with the sender.
        </p>
      </header>

      <section>
        <h2>Incoming session</h2>
        <p id="session" role="status">No CDEP session in this window.</p>
      </section>

      <section>
        <h2>Tree</h2>
        <p class="meta">
          <span id="source">Nothing loaded yet</span>
          <span id="files">No files</span>
          <span id="leaves">No tree</span>
        </p>
        <label class="upload">
          Load Newick files
          <input id="tree-file" type="file" accept=".nwk,.newick,.tree,text/plain" multiple />
        </label>
        <svg id="tree"></svg>
        <ul id="bundle"></ul>
      </section>

      <section id="metadata-section" hidden>
        <h2>Metadata</h2>
        <p class="meta">
          <span id="metadata-source"></span>
        </p>
        <table id="metadata"></table>
      </section>

      <section>
        <h2>Send this tree to another application</h2>
        <form id="send-form" class="toolbar">
          <label>
            Destination URL
            <input id="target" name="target" value="http://127.0.0.1:5181/" spellcheck="false" />
          </label>
          <label>
            Format
            <select id="format" name="format">
              <option value="newick">Newick files</option>
              <option value="bundle:tree-metadata">Tree + metadata (Newick + CSV)</option>
            </select>
          </label>
          <button type="submit" id="send" disabled>Send</button>
        </form>
        <p id="status" role="status"></p>
        <p class="meta" id="capabilities"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
